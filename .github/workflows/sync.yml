name: Framer CMS Sync

# Manual dispatch: pick a mode (test/check/setup/dry-run/sync) and run it
# against the FRAMER_API_KEY / FRAMER_PROJECT_URL repo secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: test
        type: choice
        options:
          - test
          - check
          - setup
          - dry-run
          - sync
          - dry-run-full
          - sync-full
          - audit
          - audit-apply

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Test
        if: inputs.mode == 'test'
        run: npm test

      - name: Check setup
        if: inputs.mode == 'check'
        run: npm run check

      - name: Create Framer collection + fields
        if: inputs.mode == 'setup'
        run: npm run setup

      - name: Extract starter data
        if: inputs.mode == 'dry-run' || inputs.mode == 'sync'
        run: npm run extract:starter

      - name: Dry run
        if: inputs.mode == 'dry-run'
        run: npm run dry-run

      - name: Sync
        if: inputs.mode == 'sync'
        run: npm run sync

      - name: Extract all problems
        if: inputs.mode == 'dry-run-full' || inputs.mode == 'sync-full'
        run: npm run extract:full

      - name: Dry run (full)
        if: inputs.mode == 'dry-run-full'
        run: npm run dry-run

      - name: Sync (full)
        if: inputs.mode == 'sync-full'
        run: npm run sync

      - name: Audit collection (report only)
        if: inputs.mode == 'audit'
        run: npm run audit

      - name: Audit collection (archive orphans)
        if: inputs.mode == 'audit-apply'
        run: npm run audit:apply
